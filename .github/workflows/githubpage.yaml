name: Publish GitHub Pages

on:
  push:
    branches: [mine]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: github-pages-mine
  cancel-in-progress: false

jobs:
  build-and-publish:
    if: github.ref == 'refs/heads/mine'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ github.event.repository.name == 'portofolio' && '/portofolio' || '__ROOT__' }}
          NEXT_PUBLIC_SITE_URL: ${{ github.event.repository.name == 'portofolio' && 'https://4rvyi9host.github.io/portofolio' || 'https://4rvyi9host.github.io' }}

      - name: Publish generated files to the Pages root
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -- .nojekyll 404.html 404 index.html index.txt icon.svg opengraph-image _next _not-found projects assets __next.__PAGE__.txt __next._full.txt __next._tree.txt
          if git diff --cached --quiet; then
            echo "Static site is already up to date."
            exit 0
          fi
          git commit -m "Deploy portfolio to GitHub Pages"
          git push origin HEAD:mine
